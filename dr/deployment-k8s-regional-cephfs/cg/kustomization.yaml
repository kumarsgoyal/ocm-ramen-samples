    #   - op: replace
    #     path:  /metadata/annotations/drplacementcontrol.ramendr.openshift.io~1is-cg-enabled
    #     value: true
      # - op: replace
      #   path:  /metadata/annotations/drplacementcontrol.ramendr.openshift.io~1is-submariner-enabled
      #   value: false
      - op: replace
        path: /spec/preferredCluster
        value: prsurve-c1-7j
        # value: dr1
      - op: replace
        path: /spec/drPolicyRef/name
        value: odr-policy-5m 
      - op: replace
        path: /metadata/name
