---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox
spec:
  replicas: 3
  selector:
    matchLabels:
      appname: busybox
  template:
    metadata:
      labels:
        appname: busybox
    spec:
      containers:
        - name: logger
          image: docker.io/kumarsgoyal/cg-manager:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "/app/log-replica"]
          env:
            - name: LOG_FILE_PATH
              value: "/app/data/log.yaml"
            - name: COUNTER_FILE_PATH
              value: "/app/data/counter-%d.yaml"
            - name: TIME_INTERVAL
              value: "100"
            - name: TIMEOUT
              value: "5000"
            - name: PORT
              value: ":8080"
            - name: SERVICE_ADDR
              value: "log-replica-%d.log-replica-service.default.svc.cluster.local:8080"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REPLICA_COUNT
              value: "3"
          volumeMounts:
            - name: log-replica-volume1
              mountPath: /app/data
            - name: log-replica-volume2
              mountPath: /app/data
            - name: log-replica-volume3
              mountPath: /app/data
      volumes:
        - name: log-replica-volume1
          persistentVolumeClaim:
            claimName: busybox-cg1-pvc1
        - name: log-replica-volume2
          persistentVolumeClaim:
            claimName: busybox-cg1-pvc2
        - name: log-replica-volume3
          persistentVolumeClaim:
            claimName: busybox-cg1-pvc3
