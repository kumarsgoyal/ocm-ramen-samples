---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox
spec:
  replicas: 1
  selector:
    matchLabels:
      appname: busybox
  template:
    metadata:
      labels:
        appname: busybox
    spec:
      containers:
        - name: logger
          image: quay.io/nirsof/busybox:stable
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              emit() {
                  echo "$(date) $1" | tee -a /var/log1/ramen.log
                  sync
              }
              trap "emit STOP; exit" TERM
              emit START
              while true; do
                  sleep 10 & wait
                  emit UPDATE
              done
          volumeMounts:
            - name: vol1
              mountPath: /var/log1
            - name: vol2
              mountPath: /var/log2
            - name: vol3
              mountPath: /var/log3
            - name: vol4
              mountPath: /var/log4
            - name: vol5
              mountPath: /var/log5
            - name: vol6
              mountPath: /var/log6
            - name: vol7
              mountPath: /var/log7
            - name: vol8
              mountPath: /var/log8
            - name: vol9
              mountPath: /var/log9
            - name: vol10
              mountPath: /var/log10
            - name: vol11
              mountPath: /var/log11
            - name: vol12
              mountPath: /var/log12
      volumes:
        - name: vol1
          persistentVolumeClaim:
            claimName: busybox-pvc-1
        - name: vol2
          persistentVolumeClaim:
            claimName: busybox-pvc-2
        - name: vol3
          persistentVolumeClaim:
            claimName: busybox-pvc-3
        - name: vol4
          persistentVolumeClaim:
            claimName: busybox-pvc-4
        - name: vol5
          persistentVolumeClaim:
            claimName: busybox-pvc-5
        - name: vol6
          persistentVolumeClaim:
            claimName: busybox-pvc-6
        - name: vol7
          persistentVolumeClaim:
            claimName: busybox-pvc-7
        - name: vol8
          persistentVolumeClaim:
            claimName: busybox-pvc-8
        - name: vol9
          persistentVolumeClaim:
            claimName: busybox-pvc-9
        - name: vol10
          persistentVolumeClaim:
            claimName: busybox-pvc-10
        - name: vol11
          persistentVolumeClaim:
            claimName: new-pvc-1
        - name: vol12
          persistentVolumeClaim:
            claimName: new-pvc-2

